<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1e27"/><stop offset="1" stop-color="#0a0b10"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff3b6b"/><stop offset=".22" stop-color="#ff8a3d"/>
      <stop offset=".45" stop-color="#ffd84a"/><stop offset=".65" stop-color="#3dff9a"/>
      <stop offset=".82" stop-color="#3db8ff"/><stop offset="1" stop-color="#9b5cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8a3d" stop-opacity=".55"/><stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb05c"/><stop offset="1" stop-color="#ff5f6d"/>
    </linearGradient>
    <filter id="blur" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="38"/></filter>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <!-- macOS icon grid: 824px squircle-ish tile inside the 1024 canvas, with a soft drop shadow -->
  <rect x="100" y="112" width="824" height="824" rx="185" fill="#000" opacity=".35" filter="url(#blur)"/>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <!-- the light washing the wall -->
    <ellipse cx="380" cy="512" rx="300" ry="420" fill="url(#glow)" filter="url(#blur)"/>
    <rect x="300" y="160" width="160" height="704" rx="80" fill="url(#spectrum)" opacity=".55" filter="url(#blur)"/>
    <!-- the bar -->
    <rect x="352" y="196" width="56" height="632" rx="28" fill="url(#spectrum)"/>
    <rect x="364" y="210" width="14" height="604" rx="7" fill="#fff" opacity=".45"/>
    <!-- a small screen showing the same colour -->
    <rect x="540" y="470" width="300" height="200" rx="26" fill="#2a2e38"/>
    <rect x="556" y="486" width="268" height="168" rx="16" fill="url(#screen)"/>
    <rect x="640" y="670" width="100" height="26" rx="8" fill="#2a2e38"/>
    <rect x="600" y="694" width="180" height="16" rx="8" fill="#2a2e38"/>
  </g>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="2"/>
</svg>
